[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount manager: disks, USB drives"

[[mgr.prepend_keymap]]
on   = "<Esc>"
run  = "plugin smart-escape"
desc = "Clear selection, or go to the parent directory"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "y"
run  = [ "shell -- /home/arch/.local/bin/copy-files-uri %s", "yank" ]
desc = "Yank selected files (copy) and put them on the system clipboard"

[[mgr.prepend_keymap]]
on   = [ "c", "t" ]
run  = "shell -- /home/arch/.local/bin/copy-files-uri %s"
desc = "Copy to clipboard"

[[mgr.prepend_keymap]]
on   = [ "c", "z" ]
run  = "shell --interactive --cursor=5 -- 7z a .zip %s"
desc = "Zip selected files"
