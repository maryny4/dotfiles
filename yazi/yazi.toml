# Pin editor to nvim regardless of $EDITOR
[opener]
edit = [
	{ run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
]

# PEM keys: show only the file-type line in preview, never the key body;
# Enter still opens them in the editor. yazi strips the x- prefix from file(1).
[[plugin.prepend_previewers]]
mime = "application/pem-file"
run  = "file"

[[open.prepend_rules]]
mime = "application/pem-file"
use  = [ "edit", "reveal" ]
