$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    path = /home/arch/Pictures/wallpapers/cemetery-angel.jpg
    blur_passes = 3
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.15
}

# outline_thickness 0: state colors tint the inner box
input-field {
    size = 420, 56
    outline_thickness = 0

    inner_color = rgba(0a0a0abf)
    check_color = rgba(12313bbf)
    fail_color  = rgba(3b1919bf)
    capslock_color = rgba(3b3119bf)
    font_color  = rgba(ffffffff)

    font_family = Red Hat Display
    placeholder_text = <span foreground="##595959" weight="600">Password</span>
    fail_text = <span foreground="##ff5555" weight="600">$PAMFAIL</span>

    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
}

label {
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(ffffffff)

    position = 0, 160
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgba(9a9a9aff)

    position = 0, 84
}

label {
    text = $LAYOUT[EN,RU]
    font_size = 18
    font_family = $font
    color = rgba(33ccffff)
    onclick = hyprctl switchxkblayout all next

    position = 0, -130
}
