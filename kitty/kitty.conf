font_family      JetBrainsMono Nerd Font
font_size        12.0

cursor_shape     beam
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0

background_opacity 0.92
background #0a0a0a
foreground #c8c8c8
cursor     #33ccff
url_color  #33ccff
selection_background #33ccff
selection_foreground #0a0a0a

# copy whole terminal incl. scrollback to clipboard
map ctrl+shift+a launch --type=clipboard --stdin-source=@screen_scrollback

# Ctrl+<letter> keeps working in non-ASCII layouts: fall back to the
# physical key position and re-send the Latin combo to the program.
map --allow-fallback=shifted,ascii ctrl+a send_key ctrl+a
map --allow-fallback=shifted,ascii ctrl+b send_key ctrl+b
map --allow-fallback=shifted,ascii ctrl+c send_key ctrl+c
map --allow-fallback=shifted,ascii ctrl+d send_key ctrl+d
map --allow-fallback=shifted,ascii ctrl+e send_key ctrl+e
map --allow-fallback=shifted,ascii ctrl+f send_key ctrl+f
map --allow-fallback=shifted,ascii ctrl+g send_key ctrl+g
map --allow-fallback=shifted,ascii ctrl+h send_key ctrl+h
map --allow-fallback=shifted,ascii ctrl+i send_key ctrl+i
map --allow-fallback=shifted,ascii ctrl+j send_key ctrl+j
map --allow-fallback=shifted,ascii ctrl+k send_key ctrl+k
map --allow-fallback=shifted,ascii ctrl+l send_key ctrl+l
map --allow-fallback=shifted,ascii ctrl+m send_key ctrl+m
map --allow-fallback=shifted,ascii ctrl+n send_key ctrl+n
map --allow-fallback=shifted,ascii ctrl+o send_key ctrl+o
map --allow-fallback=shifted,ascii ctrl+p send_key ctrl+p
map --allow-fallback=shifted,ascii ctrl+q send_key ctrl+q
map --allow-fallback=shifted,ascii ctrl+r send_key ctrl+r
map --allow-fallback=shifted,ascii ctrl+s send_key ctrl+s
map --allow-fallback=shifted,ascii ctrl+t send_key ctrl+t
map --allow-fallback=shifted,ascii ctrl+u send_key ctrl+u
map --allow-fallback=shifted,ascii ctrl+v send_key ctrl+v
map --allow-fallback=shifted,ascii ctrl+w send_key ctrl+w
map --allow-fallback=shifted,ascii ctrl+x send_key ctrl+x
map --allow-fallback=shifted,ascii ctrl+y send_key ctrl+y
map --allow-fallback=shifted,ascii ctrl+z send_key ctrl+z
