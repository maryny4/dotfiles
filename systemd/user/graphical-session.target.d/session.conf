# Session members. Wanted here rather than by hyprland-session.target: these
# services are After=graphical-session.target, so pulling them from a
# Before=graphical-session.target unit forms an ordering cycle that systemd
# breaks by silently dropping start jobs (waybar/hyprpaper randomly not starting).
[Unit]
Wants=waybar.service
Wants=hyprpaper.service
Wants=swaync.service
Wants=hyprpolkitagent.service
Wants=udiskie.service
Wants=hyprland-per-window-layout.service
Wants=wl-clip-persist.service
Wants=cliphist-text.service
Wants=cliphist-image.service
