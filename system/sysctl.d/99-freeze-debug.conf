# Turn a silent hang into a panic, so it leaves a trace in pstore instead of
# cutting the journal off mid-line. Remove this file once freezes are solved.
kernel.sysrq = 1
kernel.panic = 20
kernel.panic_on_oops = 1
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 120
