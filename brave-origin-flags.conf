# Read by /usr/bin/brave-origin: one flag per line, '#' comments allowed.

# Chromium refuses VA-API on NVIDIA ("Should skip nVidia device named: nvidia-drm"),
# so hardware decode stays off even though libva-nvidia-driver exposes NVDEC
# (H.264/HEVC/VP9/AV1). VaapiIgnoreDriverChecks drops that guard;
# VaapiVideoDecodeLinuxGL is required because the GL backend is in use, not Vulkan.
# Remove this line if video shows artifacts or the GPU process starts crashing.
--enable-features=VaapiVideoDecodeLinuxGL,VaapiIgnoreDriverChecks
